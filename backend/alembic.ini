# Alembic configuration for the Fashion Marketplace backend.
#
# The database URL is NOT configured here; it is read from the application's
# Settings (DATABASE_URL environment variable) inside env.py so that
# credentials are never committed to source control.

[alembic]
# Path to the migration scripts directory, relative to this file.
script_location = migrations

# Template used to generate migration script file names.
# Produces: <rev>_<slug>.py  (e.g. 0001_create_users.py)
file_template = %%(rev)s_%%(slug)s

# Timezone used for migration file timestamps.
timezone = UTC

# Truncate the "slug" part of the revision filename to this many characters.
truncate_slug_length = 60

# Set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate.
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file
# to be detected as revisions.
# sourceless = false

# Version-path separator — used on multi-database setups (unused here).
# version_path_separator = os

# Output encoding for the generated revision scripts.
output_encoding = utf-8


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
